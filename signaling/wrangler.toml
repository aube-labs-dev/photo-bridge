name = "photo-bridge-signaling"
main = "src/index.ts"
compatibility_date = "2026-09-12"
compatibility_flags = ["nodejs_compat"]

# 메모리 전용(SQLite 미사용) — 방 상태는 연결 생명주기로 관리
[[durable_objects.bindings]]
name = "ROOM"
class_name = "RoomDurableObject"

# 익명 사용량 집계 (Analytics Engine) — 성장 검증용.
# NODE 원칙: 방번호/IP/기기/사진 등 식별정보는 전혀 기록하지 않고,
# 오직 이벤트 종류별 총 횟수(room_created / paired / room_full)만 샘플링 기록한다.
[[analytics_engine_datasets]]
binding = "USAGE"
dataset = "photo_bridge_usage"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RoomDurableObject"]

# 배포 시 라우트(도메인 연결 후 활성화)
# [[routes]]
# pattern = "signaling.playwiki.org"
# custom_domain = true
